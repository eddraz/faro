name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: faro-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: faro-aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: faro-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: faro-x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="${{ matrix.asset }}-${version}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/faro" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "${{ matrix.asset }}.tar.gz" "$dir"
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
