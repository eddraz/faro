[package]
name = "faro"
version = "0.2.0"
edition = "2021"
description = "Hybrid multi-engine web search CLI: one query across 8 engines, powered by obscura and SearXNG"
license = "MIT"
repository = "https://github.com/eddraz/faro"
keywords = ["search", "cli", "searxng", "scraping", "osint"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["odd"]

[[bin]]
name = "faro"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
percent-encoding = "2"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
ureq = "2"
candle = { package = "candle-core", version = "0.9" }
candle-nn = { version = "0.9" }
candle-transformers = { version = "0.9" }
tokenizers = { version = "0.21" }
