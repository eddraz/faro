[package]
name = "faro"
version = "0.1.0"
edition = "2021"
description = "Hybrid multi-engine web search CLI powered by obscura and SearXNG"

[[bin]]
name = "faro"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
percent-encoding = "2"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
ureq = "2"
